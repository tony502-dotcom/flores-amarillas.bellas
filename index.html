<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>¡Felices 15 Años Yancy!</title>
    <style>
        @import url('https://googleapis.com');

        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #ffe5ec 0%, #ffb3c6 50%, #fbc4ab 100%);
            font-family: 'Montserrat', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            position: relative;
        }

        /* Globos Flotantes de Fondo */
        .balloon {
            position: absolute;
            width: 50px;
            height: 65px;
            border-radius: 50% 50% 50% 50% / 40% 40% 60% 60%;
            bottom: -100px;
            opacity: 0.7;
            animation: floatUp 12s infinite linear;
            z-index: 1;
        }
        .balloon::after {
            content: "🎈";
            font-size: 40px;
            position: absolute;
            top: 0;
            left: 0;
        }

        @keyframes floatUp {
            0% { transform: translateY(0) rotate(0deg); opacity: 0; }
            10% { opacity: 0.8; }
            90% { opacity: 0.8; }
            100% { transform: translateY(-110vh) rotate(20deg); opacity: 0; }
        }

        /* Tarjeta Principal */
        .card {
            background: rgba(255, 255, 255, 0.9);
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.15);
            padding: 40px 30px;
            text-align: center;
            max-width: 450px;
            width: 90%;
            border: 2px solid #fff;
            backdrop-filter: blur(10px);
            z-index: 10;
            position: relative;
            transform: scale(0.9);
            animation: appear 1s forwards cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes appear {
            100% { transform: scale(1); }
        }

        h1 {
            font-family: 'Great Vibes', cursive;
            color: #fb6f92;
            font-size: 3.5rem;
            margin: 0 0 10px 0;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.05);
        }

        h2 {
            font-size: 1.8rem;
            color: #4a4a4a;
            margin: 0;
            font-weight: 300;
            letter-spacing: 2px;
        }

        .name {
            color: #ff8fab;
            font-weight: 600;
            display: block;
            font-size: 2.3rem;
            margin-top: 5px;
        }

        .stars {
            font-size: 1.5rem;
            color: #ffe4e1;
            margin: 15px 0;
        }

        p {
            color: #6c757d;
            line-height: 1.6;
            font-size: 1rem;
            margin-bottom: 30px;
        }

        /* Botón Interactivo */
        .btn-celebrate {
            background: linear-gradient(45deg, #ff8fab, #fb6f92);
            color: white;
            border: none;
            padding: 15px 35px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(251, 111, 146, 0.4);
            transition: all 0.3s ease;
            outline: none;
        }

        .btn-celebrate:hover {
            transform: translateY(-3px) scale(1.05);
            box-shadow: 0 8px 25px rgba(251, 111, 146, 0.6);
        }

        .btn-celebrate:active {
            transform: translateY(1px);
        }

        /* Confeti */
        .confetti {
            position: absolute;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            z-index: 5;
            animation: fall 3s infinite linear;
        }

        @keyframes fall {
            0% { transform: translateY(-10px) rotate(0deg); }
            100% { transform: translateY(100vh) rotate(360deg); }
        }
    </style>
</head>
<body>

    <!-- Tarjeta de Invitación / Felicitación -->
    <div class="card">
        <h1>Mis 15 Años</h1>
        <h2>¡Feliz Cumpleaños!</h2>
        <span class="name">Yancy</span>
        <div class="stars">✨ ✦ ✨ ✦ ✨</div>
        <p>Hoy comienza una de las etapas más hermosas de tu vida. Que cada día de estos quince años esté lleno de risas, magia, sueños cumplidos y momentos inolvidables.</p>
        <button class="btn-celebrate" onclick="celebrate()">¡Haz clic para celebrar!</button>
    </div>

    <script>
        // Generar globos de fondo de forma automática
        const colors = ['#ffb3c6', '#ffe5ec', '#ff8fab', '#fb6f92', '#ffe4e1'];
        
        function createBalloon() {
            const balloon = document.createElement('div');
            balloon.classList.add('balloon');
            balloon.style.left = Math.random() * 100 + 'vw';
            balloon.style.animationDuration = (Math.random() * 6 + 6) + 's';
            
            // Variar un poco el tamaño
            const size = Math.random() * 20 + 40;
            balloon.style.width = size + 'px';
            balloon.style.height = (size * 1.3) + 'px';
            
            document.body.appendChild(balloon);
            
            setTimeout(() => {
                balloon.remove();
            }, 12000);
        }

        // Crear globos de fondo continuamente
        setInterval(createBalloon, 1500);

        // Función interactiva de celebración al pulsar el botón
        function celebrate() {
            // Efecto de lluvia de confeti
            for (let i = 0; i < 100; i++) {
                const confetti = document.createElement('div');
                confetti.classList.add('confetti');
                
                // Propiedades aleatorias para el confeti
                confetti.style.left = Math.random() * 100 + 'vw';
                confetti.style.top = (Math.random() * -20) + 'px';
                confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                confetti.style.width = Math.random() * 8 + 6 + 'px';
                confetti.style.height = confetti.style.width;
                confetti.style.animationDuration = (Math.random() * 2 + 1.5) + 's';
                confetti.style.opacity = Math.random();
                
                // Diferentes formas de confeti
                if(Math.random() > 0.5) {
                    confetti.style.borderRadius = '0%'; // Algunos cuadrados
                }

                document.body.appendChild(confetti);

                // Remover el confeti para no saturar el navegador
                setTimeout(() => {
                    confetti.remove();
                }, 3500);
            }
        }
    </script>
</body>
</html>
